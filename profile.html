<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      width: 320px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      padding: 30px 20px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #5563DE;
      margin-bottom: 15px;
      object-fit: cover;
    }

    .card h2 {
      margin: 10px 0 5px;
      color: #333;
    }

    .card h4 {
      color: #777;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .social-icons a {
      color: #fff;
      background-color: #5563DE;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: background 0.3s;
    }

    .social-icons a:hover {
      background-color: #74ABE2;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.pravatar.cc/150?img=12" alt="Profile Photo">
    <h2>CHENE</h2>
    <h4>Web Developer</h4>
    <p>Passionate about creating interactive and visually appealing websites. Always learning new tech!</p>
    <div class="social-icons">
      <a href="#"><i class="fa fa-facebook"></i>F</a>
      <a href="#"><i class="fa fa-twitter"></i>T</a>
      <a href="#"><i class="fa fa-linkedin"></i>L</a>
    </div>
  </div>
</body>
</html>
