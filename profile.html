<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>

 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

 
    .card {
      background: #fff;
      width: 320px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      padding: 30px 20px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px);
    }

  
    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #5563DE;
      margin-bottom: 15px;
      object-fit: cover;
    }

    
    .card h2 {
      margin: 10px 0 5px;
      color: #333;
      font-size: 22px;
    }

    .card h4 {
      color: #777;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .social-icons a {
      color: #fff;
      background-color: #5563DE;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .social-icons a:hover {
      background-color: #74ABE2;
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Altja_j%C3%B5gi_Lahemaal.jpg" alt="Profile Photo">
    <h2>Chene Liong</h2>
    <h4>BSIT-3F</h4>
    <p>Weh!</p>

    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </div>
</body>
</html>
